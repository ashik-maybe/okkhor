name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: End-to-end checks
        run: |
          bun run preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          bun run test:e2e
        env:
          BASE: http://localhost:4173/

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      # IndexNow (Bing/Yandex/Seznam): tell crawlers the page changed right after
      # the new build lands. The key is public by design and lives in public/.
      - name: Notify IndexNow of the new content
        if: always()
        continue-on-error: true
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"okkhor.asf.run","key":"d096431e06a1d35c7771602e57ebb6f8","keyLocation":"https://okkhor.asf.run/d096431e06a1d35c7771602e57ebb6f8.txt","urlList":["https://okkhor.asf.run/"]}'
